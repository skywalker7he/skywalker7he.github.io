format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    smooth-scroll: true
    respect-user-color-scheme: true
    citations-hover: false
    link-citations: true
    include-in-header:
      text: |
        <link id="dynamic-favicon" rel="icon" type="image/png" href="/images/logo-light.png?v=3">
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          const lightIcon = "/images/logo-light.png?v=3";
          const darkIcon = "/images/logo.png?v=3";

          function setFavicon() {
            const isDark =
              document.body.classList.contains("quarto-dark") ||
              document.documentElement.classList.contains("quarto-dark") ||
              document.body.getAttribute("data-bs-theme") === "dark" ||
              document.documentElement.getAttribute("data-bs-theme") === "dark";

            let link = document.querySelector("link#dynamic-favicon");
            if (!link) {
              link = document.createElement("link");
              link.id = "dynamic-favicon";
              link.rel = "icon";
              link.type = "image/png";
              document.head.appendChild(link);
            }

            link.href = isDark ? darkIcon : lightIcon;
          }

          setFavicon();

          const observer = new MutationObserver(setFavicon);
          observer.observe(document.documentElement, { attributes: true });
          observer.observe(document.body, { attributes: true });
        });
        </script>

execute:
  freeze: auto


